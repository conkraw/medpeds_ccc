[theme]
base = "light"
primaryColor = "#164E78"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F6FA"
textColor = "#172C43"
font = "sans serif"

[server]
maxUploadSize = 15
enableXsrfProtection = true
enableCORS = true
enableStaticServing = false
headless = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"
